name: Publish npm package

# Triggers on operator-pushed semver tags. Runs the canonical pre-publish
# verification (full test suite) then publishes to npm with sigstore
# provenance attestation enabled.
#
# Operator workflow (per docs/release-workflow.md) is unchanged through
# step 7 (tag + push). This workflow replaces the manual step 8
# (`npm publish` from a local box). Steps 9+ (GitHub Release, notifications)
# remain operator-driven.
#
# See issue #133 for background and design rationale (Option A: workflow
# runs npm publish only, operator owns everything else).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  # id-token: write is required by npm CLI to mint a sigstore-backed
  # provenance attestation from the workflow run's OIDC identity.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pre-publish gate — full test suite
        # Mirrors the test.yml content. Tests must pass on the exact tagged
        # commit before publish. Per release-safety rule in CLAUDE.md:
        # "Never tag or publish without running the full test suite on the
        #  exact commit being released."
        run: npm test

      - name: Verify package contents
        # Defensive — surfaces the tarball contents in the workflow log
        # so a maintainer reviewing the run can sanity-check what shipped.
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
